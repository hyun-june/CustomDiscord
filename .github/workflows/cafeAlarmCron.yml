name: CafeAlarm Cron

on:
  schedule:
    # 5분이 GitHub Actions 최소 주기. 실제 실행은 몇 분~수십 분 밀릴 수 있음
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # keepalive: 워크플로 재활성화용

# 이전 실행이 아직 돌고 있으면 겹치지 않게 건너뜀 (중복 알림 방지)
concurrency:
  group: cafe-alarm-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: CafeAlarm

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: CafeAlarm/package-lock.json

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run worker once
        run: node src/index.js --once
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          WEBHOOK_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_ENCRYPTION_KEY }}

      # 저장소에 60일간 활동이 없으면 GitHub이 스케줄을 끄므로, 실행할 때마다 다시 활성화해 타이머를 초기화
      - name: Keep schedule alive
        if: always()
        continue-on-error: true
        run: gh workflow enable cafeAlarmCron.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
